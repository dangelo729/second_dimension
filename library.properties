name=SecondDimension
version=0.4.0
author=Peter D'Angelo <peterdangelo729@gmail.com>
maintainer=Peter D'Angelo <peterdangelo729@gmail.com>
sentence=Tiny articulated 1-bit sprite library for 32-bit microcontrollers, in the spirit of Adafruit GFX.
paragraph=Draws 1-bit sprites with a mask, converted from PNG art by a dependency-free Python script, at any angle about a pivot and mirrored, by inverse-mapping every target pixel of the sprite's turned box through a 2x3 affine, with 2x2 OR sampling by default so 1 px lines survive the turn. Poses rigs of bones (parents first, drawn in order) and aims two-bone chains with a closed-form IK. Draws a group of sprites (an arm of segments and joints) as one shape, its one outline derived from the union of their shapes. Draws through a small render-target seam (a 1-bit canvas in drawBitmap's layout, an optional Adafruit GFX adapter, or your own three-method subclass). Nothing allocates. Needs a 32-bit board with a C++14 compiler; not for AVR.
category=Display
url=https://github.com/dangelo729/second_dimension
architectures=*
includes=SecondDimension.h
